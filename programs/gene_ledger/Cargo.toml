[package]
name = "gene_ledger"
version = "0.1.0"
description = "Verifiable species ID + DNA->protein translation (workshop demo)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "gene_ledger"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.2"

[dev-dependencies]
litesvm = "0.15"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = "3"
solana-message = "3"
solana-instruction = "3"
solana-pubkey = "3"
